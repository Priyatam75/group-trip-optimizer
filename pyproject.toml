[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "group-trip-optimizer"
version = "0.0.1"
description = "Phase 0 prototype: group trip cost optimizer CLI (cached fares only)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gto = "gto.cli:main"

[tool.setuptools]
packages = ["gto"]

[tool.setuptools.package-data]
gto = ["data/*.csv"]
